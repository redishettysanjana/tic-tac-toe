<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIC-TAC-TOE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>TIC-TAC-TOE</h1>

        <p class="status">Player X's turn</p>

        <div class="score">
            <span>X Wins: <b id="x-score">0</b></span>
            <span>O Wins: <b id="o-score">0</b></span>
            <span>Draws: <b id="draw-score">0</b></span>
        </div>

        <div class="board">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <button class="restart-btn">RESTART</button>
    </div>
    <script src="script.js"></script>

</body>

</html>
